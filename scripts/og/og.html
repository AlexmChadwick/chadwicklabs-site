<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card</title>
<style>
@font-face { font-family: "Fraunces"; src: url("../../src/fonts/fraunces-var.woff2") format("woff2"); font-weight: 300 700; }
@font-face { font-family: "Fraunces"; src: url("../../src/fonts/fraunces-italic-var.woff2") format("woff2"); font-weight: 300 500; font-style: italic; }
@font-face { font-family: "JetBrains Mono"; src: url("../../src/fonts/jetbrains-mono-var.woff2") format("woff2"); font-weight: 400 700; }
* { margin: 0; box-sizing: border-box; }
html, body { width: 1200px; height: 630px; }
body {
  background: #f3eee4;
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 41px, rgba(26,24,20,.07) 41px, rgba(26,24,20,.07) 42px);
  color: #1a1814; font-family: "Fraunces", serif;
  padding: 64px 80px; display: flex; flex-direction: column; position: relative;
}
.top { display: flex; justify-content: space-between; font: 500 22px "JetBrains Mono", monospace; letter-spacing: .1em; text-transform: uppercase; border-bottom: 2px solid #1a1814; padding-bottom: 18px; }
.top b { color: #a5350b; font-weight: 500; }
h1 { font-weight: 340; font-size: 168px; line-height: .86; letter-spacing: -.035em; margin-top: 54px; font-variation-settings: "opsz" 144; }
h1 em { display: block; font-style: italic; font-weight: 300; padding-left: 110px; }
h1 em::after { content: "."; color: #e2501c; font-style: normal; }
p { margin-top: auto; font-size: 38px; color: #4f4a42; font-variation-settings: "opsz" 36; }
</style>
</head>
<body>
<div class="top"><span>chadwicklabs.com</span><b>Index of works</b></div>
<h1>Alex <em>Chadwick</em></h1>
<p>Things I build, ship and keep running.</p>
</body>
</html>
