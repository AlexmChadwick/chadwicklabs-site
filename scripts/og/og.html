<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card</title>
<style>
@font-face { font-family: "Big Shoulders Display"; src: url("../../src/fonts/big-shoulders-display-var.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "JetBrains Mono"; src: url("../../src/fonts/jetbrains-mono-var.woff2") format("woff2"); font-weight: 400 700; }
@font-face { font-family: "Silkscreen"; src: url("../../src/fonts/silkscreen.woff2") format("woff2"); }
* { margin: 0; box-sizing: border-box; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body { background: #05060b; color: #eef0f7; display: grid; grid-template-rows: 1fr 150px; }
.top { padding: 56px 72px 0; position: relative;
  background-image: radial-gradient(rgba(154,163,255,.18) 1px, transparent 1.2px); background-size: 6px 6px; }
.k { font: 22px "Silkscreen", monospace; text-transform: uppercase; color: #9aa3ff; display: flex; gap: 14px; align-items: center; }
.k::before { content: ""; width: 14px; height: 14px; background: currentColor; }
h1 { font: 800 200px/.8 "Big Shoulders Display", sans-serif; text-transform: uppercase; margin-top: 30px; }
h1 span { display: block; color: transparent; -webkit-text-stroke: 3px #eef0f7; }
.slab { background: #1b26f2; color: #fff; padding: 0 72px; display: flex; align-items: center; justify-content: space-between; font: 500 30px "JetBrains Mono", monospace; }
.slab b { font: 22px "Silkscreen", monospace; text-transform: uppercase; }
</style>
</head>
<body>
<div class="top"><p class="k">chadwick/labs</p><h1>Alex <span>Chadwick</span></h1></div>
<div class="slab"><p>Product and agentic commerce.</p><b>chadwicklabs.com</b></div>
</body>
</html>
